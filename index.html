
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超自然行動組｜卡密商城</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d16;color:#f4f6ff;font-family:Arial,sans-serif}
header{padding:24px 18px;background:#111a2b;border-bottom:1px solid #283650}
h1{font-size:23px;margin:0 0 8px}
p{color:#aab5ca}
main{padding:18px;max-width:600px;margin:auto}
.banner{padding:22px;border-radius:18px;background:linear-gradient(135deg,#263e69,#171d35);margin-bottom:20px}
.card{padding:18px;background:#141c2b;border:1px solid #293750;border-radius:15px;margin:12px 0}
.price{color:#71d9ff;font-size:22px;font-weight:bold}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#3978ff;color:white;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;margin-top:8px;border-radius:9px;border:1px solid #35445f;background:#0b1120;color:white}
.note{font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>✦ 超自然行動組</h1>
<div>國際服・卡密商城</div>
</header>
<main>
<section class="banner">
<h2>WELCOME BACK</h2>
<p>挑選商品，查看商品資訊與購買方式。</p>
</section>
<h2>🛒 商品列表</h2>
<div class="card">
<h3>🎮 國際服商品</h3>
<p>商品一｜請聯絡管理員確認內容</p>
<div class="price">價格待設定</div>
<button onclick="alert('目前為展示版，尚未開放下單。')">查看購買方式</button>
</div>
<div class="card">
<h3>🔑 卡密查詢</h3>
<p>如果你已購買，請透過官方客服查詢卡密。</p>
<input id="order" placeholder="輸入訂單編號">
<button onclick="alert('此功能尚未連接訂單系統，請聯絡管理員。')">查詢訂單</button>
</div>
<div class="card">
<h3>📢 購買須知</h3>
<p class="note">本網站目前為展示版本，尚未串接付款、訂單或自動發卡功能。請勿輸入密碼、付款資料或其他敏感資訊。</p>
</div>
</main>
</body>
</html>
